<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEDICUS Planner</title>

<link rel="stylesheet" href="style.css?v=1.1.0">

</head>


<body>


<header>

    <h1>
        MEDICUS Planner
    </h1>


    <div id="status">
        v1.1.0
    </div>

</header>




<div id="month-bar">

    <button data-month="STYCZEŃ">STYCZEŃ</button>
    <button data-month="LUTY">LUTY</button>
    <button data-month="MARZEC">MARZEC</button>
    <button data-month="KWIECIEŃ">KWIECIEŃ</button>
    <button data-month="MAJ">MAJ</button>
    <button data-month="CZERWIEC">CZERWIEC</button>
    <button data-month="LIPIEC">LIPIEC</button>
    <button data-month="SIERPIEŃ">SIERPIEŃ</button>
    <button data-month="WRZESIEŃ">WRZESIEŃ</button>
    <button data-month="PAŹDZIERNIK">PAŹDZIERNIK</button>
    <button data-month="LISTOPAD">LISTOPAD</button>
    <button data-month="GRUDZIEŃ">GRUDZIEŃ</button>

</div>




<h2 id="current-month">
    Ładowanie...
</h2>




<div id="planner"></div>




<footer>

    <span id="info">
        Ładowanie danych...
    </span>

</footer>




<script src="script.js"></script>


</body>

</html>
